<div class="px-4 py-2 border-b border-base-300">
    <span class="font-medium">{{ username }}</span>
    <span class="px-2 py-0.5 ml-2 {{ solution.status_badge }} badge-soft">{{ solution.get_status_display }}</span>
  </div>

  <!-- Code area -->
  <pre class="flex-1 p-4 text-sm bg-base-200 overflow-auto 
              h-40 whitespace-break-spaces"><code>{{solution.code}}</code></pre>

  <!-- Footer -->
  <div class="flex items-center justify-between px-4 py-2 border-t border-base-300 text-xs text-gray-600">
    <span>Runtime: <strong>{{ solution.runtime }}</strong></span>
    <span>Memory: <strong>{{ solution.memory }}</strong></span>
  </div>
